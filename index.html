<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Name Flashcards</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    
    header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 400px; }
    h1 { font-size: 1.5rem; margin-bottom: 15px; }
    
    .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; width: 100%; }
    select { background: var(--card-bg); color: var(--text); border: 1px solid #334155; padding: 10px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; flex: 1; }
    
    .card-container { width: 100%; max-width: 360px; height: 460px; position: relative; margin-bottom: 20px; cursor: pointer; border-radius: 16px; overflow: hidden; background: var(--card-bg); border: 1px solid #334155; }
    .card-container.hidden { display: none !important; }
    .card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    /* Preloader & Loading Overlay */
    .loader-overlay { position: absolute; inset: 0; background: var(--card-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
    .loader-overlay.hidden { display: none; }
    .spinner { width: 36px; height: 36px; border: 4px solid #334155; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-bar-container { width: 80%; background: #334155; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 10px; }
    .progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.2s; }
    .loading-text { font-size: 0.9rem; color: var(--text-muted); text-align: center; }

    .overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(15, 23, 42, 0.95) 40%); padding: 30px 16px 20px 16px; text-align: center; display: none; z-index: 5; }
    .overlay.visible { display: block; }
    
    .preferred-name { font-size: 1.8rem; font-weight: bold; color: var(--text); margin-bottom: 4px; }
    .formal-name { font-size: 1rem; color: var(--text-muted); font-style: italic; }
    
    .nav-btns { display: flex; gap: 10px; width: 100%; max-width: 360px; margin-bottom: 10px; }
    .nav-btns button { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; flex: 1; }
    .nav-btns button:hover { opacity: 0.9; }
    
    .status { font-size: 0.85rem; color: var(--text-muted); margin-top: 5px; text-align: center; }

    /* Grid View Styles */
    .grid-container { 
      width: 100%; 
      max-width: 360px; 
      height: 460px; 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      grid-auto-rows: max-content;
      align-items: start;
      gap: 12px; 
      overflow-y: auto; 
      margin-bottom: 20px; 
      padding-right: 4px; 
    }
    .grid-container.hidden { display: none !important; }
    
    /* Scaled-down replica card design */
    .grid-card { 
      position: relative; 
      width: 100%; 
      min-height: 0;
      aspect-ratio: 360 / 460; 
      border-radius: 12px; 
      overflow: hidden; 
      background: var(--card-bg); 
      border: 1px solid #334155; 
    }
    .grid-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .grid-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(15, 23, 42, 0.95) 40%); padding: 20px 8px 10px 8px; text-align: center; z-index: 5; }
    .grid-pref-name { font-size: 0.95rem; font-weight: bold; color: var(--text); margin-bottom: 2px; line-height: 1.1; }
    .grid-formal-name { font-size: 0.7rem; color: var(--text-muted); font-style: italic; line-height: 1; }
  </style>
</head>
<body>

<header>
  <h1>Student Flashcards</h1>
  <div class="controls">
    <select id="groupSelect" onchange="handleGroupChange()"></select>
    <select id="batchSizeSelect" onchange="handleModeChange()">
      <option value="5">Batches of 5</option>
      <option value="8">Batches of 8</option>
      <option value="all">Full Class</option>
      <option value="grid">Grid View</option>
    </select>
  </div>
</header>

<!-- Flashcard View -->
<div class="card-container" id="cardContainer" onclick="handleCardClick()">
  <div class="loader-overlay" id="loaderOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loaderText">Loading group data...</div>
    <div class="progress-bar-container" id="progressContainer" style="display:none;">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>
  
  <img id="studentImg" class="card-img" src="" alt="Student Photo" />
  
  <div class="overlay" id="nameOverlay">
    <div class="preferred-name" id="prefName">---</div>
    <div class="formal-name" id="formalName"></div>
  </div>
</div>

<!-- Standalone Grid View -->
<div class="grid-container hidden" id="gridContainer"></div>

<!-- Navigation Controls -->
<div class="nav-btns" id="navBtns">
  <button onclick="prevBatch()">Previous Batch</button>
  <button onclick="nextBatch()">Next Batch</button>
</div>

<div class="status" id="statusText">Fetching folders...</div>

<script>
  const REPO_OWNER = 'julianhamm';
  const REPO_NAME = 'student-flashcards';
  
  let rawStudents = [];
  let batches = [];
  let currentBatchIdx = 0;
  let currentCardIdx = 0;
  let isRevealed = false;
  
  const imageCache = new Map();

  function parseFilename(filename) {
    let clean = filename.replace(/\.[^/.]+$/, "");
    let match = clean.match(/^(.*?)\s*\((.*?)\)$/);
    
    if (match) {
      let fullName = match[1].trim();
      let prefName = match[2].trim();
      let nameParts = fullName.split(" ");
      let lastName = nameParts.length > 1 ? nameParts[nameParts.length - 1] : "";
      return { preferred: `${prefName} ${lastName}`.trim(), formal: fullName };
    } else {
      return { preferred: clean, formal: "" };
    }
  }

  async function init() {
    try {
      let res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/photos`);
      let items = await res.json();
      let folders = items.filter(item => item.type === 'dir');
      let select = document.getElementById('groupSelect');
      select.innerHTML = '';

      if (folders.length === 0) {
        showLoader('No folders found in photos/', false);
        return;
      }

      for (let folder of folders) {
        select.innerHTML += `<option value="${folder.name}">${folder.name}</option>`;
      }

      startSession();
    } catch (err) {
      showLoader('Error connecting to GitHub API.', false);
      console.error(err);
    }
  }

  function handleGroupChange() {
    imageCache.clear();
    document.getElementById('batchSizeSelect').value = '5';
    startSession();
  }

  async function startSession() {
    let group = document.getElementById('groupSelect').value;
    if (!group) return;

    isRevealed = false;
    document.getElementById('nameOverlay').classList.remove('visible');
    document.getElementById('studentImg').src = '';
    
    // Switch UI context to flashcards while fetching
    document.getElementById('cardContainer').classList.remove('hidden');
    document.getElementById('gridContainer').classList.add('hidden');
    document.getElementById('navBtns').style.display = 'flex';
    
    showLoader(`Fetching student list for ${group}...`, false);

    try {
      let res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/photos/${encodeURIComponent(group)}`);
      let files = await res.json();
      let imageFiles = files.filter(f => f.name.match(/\.(jpg|jpeg|png)$/i));
      
      rawStudents = imageFiles.map(f => {
        let names = parseFilename(f.name);
        return { path: f.path, preferred: names.preferred, formal: names.formal };
      });

      handleModeChange();
      
      preloadRemainingClass();
    } catch (err) {
      showLoader('Error loading set photos.', false);
      console.error(err);
    }
  }

  async function handleModeChange() {
    let mode = document.getElementById('batchSizeSelect').value;

    if (mode === 'grid') {
      renderGridView();
    } else {
      document.getElementById('gridContainer').classList.add('hidden');
      document.getElementById('cardContainer').classList.remove('hidden');
      document.getElementById('navBtns').style.display = 'flex';

      shuffle(rawStudents);
      createBatches();

      currentBatchIdx = 0;
      currentCardIdx = 0;

      await preloadActiveBatch();
    }
  }

  function renderGridView() {
    hideLoader();
    document.getElementById('cardContainer').classList.add('hidden');
    document.getElementById('navBtns').style.display = 'none';

    let gridContainer = document.getElementById('gridContainer');
    gridContainer.innerHTML = '';
    gridContainer.classList.remove('hidden');

    let sortedStudents = [...rawStudents].sort((a, b) => a.preferred.localeCompare(b.preferred));

    for (let student of sortedStudents) {
      let card = document.createElement('div');
      card.className = 'grid-card';

      let img = document.createElement('img');
      img.src = student.path;
      img.alt = student.preferred;

      let overlay = document.createElement('div');
      overlay.className = 'grid-overlay';

      let prefName = document.createElement('div');
      prefName.className = 'grid-pref-name';
      prefName.innerText = student.preferred;

      let formalName = document.createElement('div');
      formalName.className = 'grid-formal-name';
      formalName.innerText = student.formal ? `(${student.formal})` : '';

      overlay.appendChild(prefName);
      if (student.formal) overlay.appendChild(formalName);

      card.appendChild(img);
      card.appendChild(overlay);

      gridContainer.appendChild(card);
    }

    let group = document.getElementById('groupSelect').value;
    document.getElementById('statusText').innerText = `Grid View  |  ${rawStudents.length} Students (${group})`;
  }

  function createBatches() {
    batches = [];
    let sizeOpt = document.getElementById('batchSizeSelect').value;
    
    if (sizeOpt === 'all' || rawStudents.length <= parseInt(sizeOpt)) {
      batches.push([...rawStudents]);
      return;
    }

    let bSize = parseInt(sizeOpt);
    let total = rawStudents.length;
    let fullBatches = Math.floor(total / bSize);
    let remainder = total % bSize;

    for (let i = 0; i < fullBatches; i++) {
      batches.push(rawStudents.slice(i * bSize, (i + 1) * bSize));
    }

    if (remainder > 0) {
      let lastChunk = rawStudents.slice(fullBatches * bSize);
      let needed = bSize - remainder;
      let pool = rawStudents.slice(0, fullBatches * bSize);
      shuffle(pool);
      let paddedBatch = [...lastChunk, ...pool.slice(0, needed)];
      batches.push(paddedBatch);
    }
  }

  function fetchImage(path) {
    if (imageCache.has(path)) return Promise.resolve(imageCache.get(path));
    
    return new Promise((resolve) => {
      let img = new Image();
      img.onload = () => {
        imageCache.set(path, img);
        resolve(img);
      };
      img.onerror = () => resolve(null);
      img.src = path;
    });
  }

  async function preloadActiveBatch() {
    let currentBatch = batches[currentBatchIdx];
    if (!currentBatch || currentBatch.length === 0) return;

    showLoader('Caching images...', true);
    updateProgress(0, currentBatch.length);

    let loadedCount = 0;
    for (let student of currentBatch) {
      await fetchImage(student.path);
      loadedCount++;
      updateProgress(loadedCount, currentBatch.length);
    }

    hideLoader();
    renderCard();
  }

  async function preloadRemainingClass() {
    for (let student of rawStudents) {
      if (!imageCache.has(student.path)) {
        fetchImage(student.path);
      }
    }
  }

  function showLoader(text, showBar) {
    document.getElementById('loaderText').innerText = text;
    document.getElementById('progressContainer').style.display = showBar ? 'block' : 'none';
    document.getElementById('loaderOverlay').classList.remove('hidden');
  }

  function updateProgress(count, total) {
    let pct = Math.round((count / total) * 100);
    document.getElementById('progressBar').style.width = `${pct}%`;
    document.getElementById('loaderText').innerText = `Caching batch: ${count} of ${total} loaded`;
  }

  function hideLoader() {
    document.getElementById('loaderOverlay').classList.add('hidden');
  }

  function renderCard() {
    isRevealed = false;
    document.getElementById('nameOverlay').classList.remove('visible');

    let currentBatch = batches[currentBatchIdx];
    if (!currentBatch || currentBatch.length === 0) return;

    let student = currentBatch[currentCardIdx];
    document.getElementById('studentImg').src = student.path;
    document.getElementById('prefName').innerText = student.preferred;
    document.getElementById('formalName').innerText = student.formal ? `(${student.formal})` : '';

    let group = document.getElementById('groupSelect').value;
    document.getElementById('statusText').innerText = 
      `Card ${currentCardIdx + 1} of ${currentBatch.length}  |  Batch ${currentBatchIdx + 1} of ${batches.length} (${group})`;
  }

  function handleCardClick() {
    if (!isRevealed) {
      document.getElementById('nameOverlay').classList.add('visible');
      isRevealed = true;
    } else {
      nextCard();
    }
  }

  function nextCard() {
    let currentBatch = batches[currentBatchIdx];
    currentCardIdx++;
    
    if (currentCardIdx >= currentBatch.length) {
      currentCardIdx = 0;
      shuffle(currentBatch);
    }
    
    renderCard();
  }

  async function nextBatch() {
    if (batches.length === 0) return;
    currentBatchIdx = (currentBatchIdx + 1) % batches.length;
    currentCardIdx = 0;
    
    await preloadActiveBatch();
  }

  async function prevBatch() {
    if (batches.length === 0) return;
    currentBatchIdx = (currentBatchIdx - 1 + batches.length) % batches.length;
    currentCardIdx = 0;
    
    await preloadActiveBatch();
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      let j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  window.onload = init;
</script>
</body>
</html>
